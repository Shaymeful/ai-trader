# Trading Bot Configuration
# This file defines strategy parameters, risk limits, and universe settings

# Strategy timeframe
timeframe: "1h"

# Risk management caps
risk:
  max_order_usd: 100
  max_daily_loss_usd: 250
  max_gross_exposure_usd: 10000

# Execution settings
execution:
  allow_fractional: true  # Enable fractional share orders (paper mode only)

# Performance tracking (Shadow PnL)
performance:
  min_samples: 20   # Minimum samples required before strategy weight updates
  max_samples: 200  # Maximum rolling return samples to keep per strategy

# Trading universe
universe:
  core:
    symbols:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - NVDA
      - AMD
      - META
      - GOOGL
      - TSLA
      - XLF
      - XLE
      - XLV
