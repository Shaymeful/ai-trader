# Trading Bot Configuration
# This file defines strategy parameters, risk limits, and universe settings

# Strategy timeframe
timeframe: "1h"

# Risk management caps
risk:
  max_order_usd: 2500          # Increased from $100 to allow meaningful position sizes
  max_daily_loss_usd: 250      # Maintained as safety net
  max_gross_exposure_usd: 50000  # Increased from $10k to allow multiple positions

# Execution settings
execution:
  allow_fractional: true  # Enable fractional share orders (paper mode only)

# Performance tracking (Shadow PnL)
performance:
  min_samples: 20   # Minimum samples required before strategy weight updates
  max_samples: 200  # Maximum rolling return samples to keep per strategy

# Trading universe - Sector-based configuration
universe:
  # Fallback behavior when resolving symbols
  # Options: "preserve_order" (default), "alphabetical"
  fallback_mode: "preserve_order"

  # Sector groups
  sectors:
    core_index:
      enabled: true
      description: "Major market index ETFs"
      symbols:
        - SPY
        - QQQ

    mega_cap_tech:
      enabled: true
      description: "Mega-cap technology stocks"
      symbols:
        - AAPL
        - MSFT
        - NVDA
        - AMD
        - META
        - GOOGL
        - TSLA

    us_sector_etfs:
      enabled: true
      description: "US sector rotation ETFs"
      symbols:
        - XLF
        - XLE
        - XLV

    automation:
      enabled: false
      description: "Automation and industrial technology stocks"
      symbols: []

# LLM Universe Advisor Configuration
llm:
  # Provider mode: primary_fallback | ensemble | openai_only | anthropic_only
  mode: "openai_only"

  # Primary provider (for primary_fallback mode)
  primary: "openai"  # openai | anthropic

  # Model specifications
  openai_model: "gpt-4o-mini"
  anthropic_model: "claude-3-5-sonnet-20241022"

  # API timeouts
  timeout_seconds: 30

  # Safety guardrails
  min_confidence: 0.60  # Lowered from 0.70 to allow more proposals
  proposal_ttl_minutes: 120
  max_sector_toggles_per_day: 1
  cooldown_days: 3

  # RSS event filtering
  rss_lookback_hours: 24
  rss_max_headlines: 100

  # Auto-generation
  auto_generate_enabled: true
  auto_generate_interval_hours: 4

  # Constituent change proposals
  enable_constituent_proposals: true
  allow_constituent_removals: false
  max_add_per_run: 3  # Increased from 2 to allow more new candidates
  max_remove_per_run: 1
  min_confidence_add: 0.70  # Lowered from 0.80 to allow more adds
  min_confidence_remove: 0.85
  cooldown_days_per_ticker: 5  # Reduced from 7 to allow faster re-evaluation
  ticker_blacklist: []

# AI Co-Pilot Configuration (Advisory Layer)
# SAFETY: Default OFF, never blocks loop, advisory-only outputs
ai_copilot:
  # Master switch (can be overridden by AI_COPILOT_ENABLED env var: 0=off, 1=on)
  # CRITICAL: If trading is disabled, AI Co-Pilot is forced OFF regardless of this setting
  enabled: false

  # CRITICAL: Controls whether AI output can influence decisions (default: false)
  # When false, AI outputs are purely advisory metadata
  # MUST remain false - cannot be changed via UI
  influence_decisions: false

  # Model configuration (reuses existing LLM setup)
  model: "gpt-4o-mini"  # Cost-effective for advisory tasks

  # Budget limits per run (safety gates)
  max_calls_per_run: 4      # Maximum LLM calls per loop iteration
  timeout_s: 20             # Request timeout in seconds

  # Global budget constraints
  budgets:
    global_max_output_tokens: 1200  # Global token cap across all features

  # Feature flags with per-feature token limits
  trade_rationale:
    enabled: true
    max_output_tokens: 500  # Per-call token limit for trade rationale

  daily_journal:
    enabled: true
    max_output_tokens: 1200  # Per-call token limit for daily journal

  strategy_critique:
    enabled: true
    max_output_tokens: 900  # Per-call token limit for strategy critique
