# Trading Bot Configuration
# This file defines strategy parameters, risk limits, and universe settings

# Strategy timeframe
timeframe: "1h"

# Risk management caps
risk:
  max_order_usd: 100
  max_daily_loss_usd: 250
  max_gross_exposure_usd: 10000

# Execution settings
execution:
  allow_fractional: true  # Enable fractional share orders (paper mode only)

# Performance tracking (Shadow PnL)
performance:
  min_samples: 20   # Minimum samples required before strategy weight updates
  max_samples: 200  # Maximum rolling return samples to keep per strategy

# Trading universe - Sector-based configuration
universe:
  # Fallback behavior when resolving symbols
  # Options: "preserve_order" (default), "alphabetical"
  fallback_mode: "preserve_order"

  # Sector groups
  sectors:
    core_index:
      enabled: true
      description: "Major market index ETFs"
      symbols:
        - SPY
        - QQQ

    mega_cap_tech:
      enabled: true
      description: "Mega-cap technology stocks"
      symbols:
        - AAPL
        - MSFT
        - NVDA
        - AMD
        - META
        - GOOGL
        - TSLA

    us_sector_etfs:
      enabled: true
      description: "US sector rotation ETFs"
      symbols:
        - XLF
        - XLE
        - XLV
