# Trading Mode Profiles
# Each profile defines coordinated settings across strategies, universe, selector, and AI features
#
# Design: Future-proof for adding more profiles (e.g., conservative, swing_trade, etc.)

profiles:
  # Default balanced trading mode
  normal:
    description: "Balanced trading with standard risk controls and full AI features"

    # Strategy configuration
    strategies:
      AI_COPILOT_WEIGHTED:
        enabled: false
        weight: 0.10
        params:
          execution_enabled: false

    # Universe sector enables
    universe:
      sectors:
        core_index: true       # SPY, QQQ
        mega_cap_tech: true    # AAPL, MSFT, NVDA, etc.
        us_sector_etfs: true   # XLF, XLE, XLV
        automation: false

    # Selector (candidate engine) settings
    selector:
      candidates_max_count: 40
      candidates_min_confidence: 0.65
      duplicate_suppression_minutes: 30
      ttl_minutes_buy: 180
      ttl_minutes_sell: 120
      max_candidates_per_run: 15

    # AI Co-Pilot feature toggles
    ai_copilot:
      trade_rationale: true
      daily_journal: true
      strategy_critique: true
      universe_ticker_manager: false

  # Aggressive intraday tech/energy focus
  aggressive_tech_energy:
    description: "Aggressive tech+energy daytrade with dynamic ticker management and reduced noise"

    # Strategy configuration
    strategies:
      AI_COPILOT_WEIGHTED:
        enabled: true
        weight: 0.35  # Higher allocation for aggressive mode
        params:
          execution_enabled: true  # Enable execution (still respects global guardrails)

    # Universe sector enables
    universe:
      sectors:
        core_index: false      # Disable SPY/QQQ to reduce noise
        mega_cap_tech: true    # Focus on tech
        us_sector_etfs: true   # Includes XLE for energy
        automation: false

    # Selector (candidate engine) settings - more aggressive
    selector:
      candidates_max_count: 80
      candidates_min_confidence: 0.52  # Lower threshold for more candidates
      duplicate_suppression_minutes: 12  # Allow faster re-evaluation
      ttl_minutes_buy: 90      # Shorter TTL for daytrade
      ttl_minutes_sell: 60
      max_candidates_per_run: 25  # More candidates per run

    # AI Co-Pilot feature toggles - redirect thinking power
    ai_copilot:
      trade_rationale: true         # Keep for trade justification
      daily_journal: false          # Disable to save tokens
      strategy_critique: false      # Disable to save tokens
      universe_ticker_manager: true # Enable dynamic ticker management

  # Small/mid cap swing trading mode
  small_cap_swing:
    description: "Small/mid cap swing trading with market cap constraints and longer hold periods"

    # Strategy configuration
    strategies:
      AI_COPILOT_WEIGHTED:
        enabled: true
        weight: 0.50  # Higher allocation for focused swing trading
        params:
          execution_enabled: true  # Enable execution (respects global guardrails + execution gate)

    # Universe sector enables - disable mega caps, enable all others
    universe:
      sectors:
        core_index: false       # Disable SPY/QQQ (mega caps)
        mega_cap_tech: false    # Disable AAPL/MSFT/NVDA (mega caps)
        us_sector_etfs: false   # Disable sector ETFs (not small caps)
        automation: true        # Enable automation sector (if has small caps)

    # Selector (candidate engine) settings - swing trading profile
    selector:
      candidates_max_count: 60            # Moderate candidate count
      candidates_min_confidence: 0.55     # Lower threshold for more opportunities
      duplicate_suppression_minutes: 30   # Standard for swing
      ttl_minutes_buy: 720                # 12 hours - longer for swing setups
      ttl_minutes_sell: 480               # 8 hours - longer hold consideration
      max_candidates_per_run: 20          # More candidates to find small caps

    # AI Co-Pilot feature toggles - focus on ticker discovery and swing setups
    ai_copilot:
      trade_rationale: true               # Keep for swing trade justification
      daily_journal: false                # Disable to save tokens
      strategy_critique: false            # Disable to save tokens
      universe_ticker_manager: true       # Enable for small cap discovery

    # Execution gate - HARD constraints for small/mid cap targeting
    execution_gate:
      min_market_cap_usd: 300000000       # $300M minimum (small cap floor)
      max_market_cap_usd: 10000000000     # $10B maximum (exclude mega caps)
      min_price: 3.00                     # Avoid penny stocks
      max_price: 80.00                    # Reasonable upper bound for small caps
      min_avg_dollar_volume_20d: 5000000  # $5M min daily volume (liquidity floor)
      max_spread_bps: 100                 # 1.00% max spread (allow wider for small caps)
      require_fundamentals: false         # Don't block if data unavailable
      strict_mode: true                   # Hard block (not advisory)
      exclude_symbols: []                 # Ban list (empty by default)
      allow_symbols: []                   # Allowlist override (empty by default)

  # Aggressive small/mid cap sentiment trading mode
  aggressive_small_mid_sentiment:
    description: "Sentiment-driven automation+energy swing trading with multi-factor scoring"

    # Strategy configuration - AI Copilot with sentiment-adjusted weights
    strategies:
      AI_COPILOT_WEIGHTED:
        enabled: true
        weight: 0.60  # 60% portfolio allocation
        params:
          execution_enabled: true  # Enable execution (respects global guardrails + execution gate)
          # Specific position weights per symbol (within allocated 60%)
          # NOTE: Using current universe symbols (see universe_overrides.json)
          per_sector_weights:
            automation:
              TPL: 0.10   # Texas Pacific Land
              ROK: 0.08   # Rockwell Automation
              CRH: 0.08   # CRH plc
            energy:
              FSLR: 0.12  # First Solar (now allowed, max_price raised to $250)
              ENPH: 0.10  # Enphase Energy
              RUN: 0.08   # Sunrun

    # Universe sector enables - LOCK to automation + energy only
    universe:
      sectors:
        core_index: false       # Disable SPY/QQQ
        mega_cap_tech: false    # Disable mega caps
        us_sector_etfs: false   # Disable sector ETFs
        automation: true        # Enable automation sector
        energy: true            # Enable energy sector

    # Selector (candidate engine) settings - sentiment mode profile
    selector:
      candidates_max_count: 80              # Higher for sentiment-driven discovery
      candidates_min_confidence: 0.55       # Lowered threshold for sentiment mode
      duplicate_suppression_minutes: 30     # Standard for swing trading
      ttl_minutes_buy: 1440                 # 24 hours for sentiment setups
      ttl_minutes_sell: 1440                # 24 hours for exit signals
      max_candidates_per_run: 25            # More candidates for sentiment evaluation
      # Market cap filter for small/mid cap targeting
      market_cap_filter:
        enabled: true
        min_usd: 300000000                  # $300M minimum (small cap floor)
        max_usd: 20000000000                # $20B maximum (mid cap ceiling)

    # AI Co-Pilot feature toggles - focus on sentiment and execution
    ai_copilot:
      trade_rationale: true                 # Keep for sentiment trade justification
      daily_journal: false                  # Disable to save tokens
      strategy_critique: false              # Disable to save tokens
      universe_ticker_manager: true         # Enable for dynamic ticker discovery

    # Execution gate - HARD constraints for small/mid cap + sentiment mode
    execution_gate:
      min_market_cap_usd: 300000000         # $300M minimum (small cap floor)
      max_market_cap_usd: 20000000000       # $20B maximum (exclude large caps)
      min_price: 5.00                       # Avoid penny stocks
      max_price: 250.00                     # Raised to allow solar stocks (FSLR ~$240)
      min_avg_dollar_volume_20d: 5000000    # $5M min daily volume (liquidity floor)
      max_spread_bps: 100                   # 1.00% max spread (allow wider for small caps)
      require_fundamentals: false           # Don't block if data unavailable
      strict_mode: true                     # Hard block (not advisory)
      exclude_symbols: []                   # Ban list (empty by default)
      allow_symbols: []                     # Allowlist override (empty by default)

    # Exit thresholds - hard rules for sentiment trades
    exit_thresholds:
      stop_loss_pct: 6.0                    # 6% stop loss
      take_profit_pct: 10.0                 # 10% take profit
      trailing_stop_trigger_pct: 5.0        # Start trailing after 5% gain
      trailing_stop_pct: 3.0                # Trail by 3% from peak

    # Risk limits - tailored for sentiment mode
    risk_limits:
      max_portfolio_exposure_pct: 0.60      # 60% max portfolio exposure
      max_per_position_pct: 0.15            # 15% max per position
      max_positions: 10                     # 5-10 concurrent positions target

    # Target utilization allocator - size orders to reach exposure target
    allocation:
      enable_target_utilization: true       # Enable target-seeking allocation
      min_order_notional: 500               # Minimum $ per order (avoid tiny orders)
      allow_position_adds: false            # Top-up existing positions (false = new positions only)

# Active profile (can be overridden at runtime)
active_profile: "normal"
