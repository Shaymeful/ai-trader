# RSS Selector Configuration
# Targets: Automation and Energy sectors

sectors_enabled:
  - automation
  - energy

# RSS Feed URLs (add your preferred feeds here)
rss_feeds:
  # Test fixtures (used by unit tests - keep for testing)
  - https://example.com/automation
  - https://example.com/energy

  # Real RSS feeds for automation/industrials sector
  - https://roboticsandautomationnews.com/feed/  # Robotics & Automation News
  - https://www.investing.com/rss/news_25.rss  # Stock Market News (includes industrials)
  - https://www.roboticstomorrow.com/rss.xml  # Robotics & Automation
  - https://seekingalpha.com/feed.xml  # Seeking Alpha All Articles (ticker-heavy)

  # Real RSS feeds for energy sector
  - https://www.investing.com/rss/commodities_Energy.rss  # Energy Analysis & News
  - https://www.investing.com/rss/news_11.rss  # Commodities & Futures News
  - https://energywatch.com/service/rss  # Energy, Oil & Gas, Renewables News
  - https://renewablesnow.com/feed/  # Renewable Energy News

  # Stock-specific feeds with ticker symbols
  - https://www.investing.com/rss/stock.rss  # Stock Markets Analysis (ticker mentions)

  # Additional options for future:
  # - https://finance.yahoo.com/news/rssindex  # Yahoo Finance (may require specific ticker feeds)
  # - https://www.marketwatch.com/rss/  # MarketWatch (multiple feeds available)

# Keyword rules for sector classification
keyword_rules:
  automation:
    tags:
      - automation
    keywords:
      - automation
      - robot
      - robotics
      - warehouse
      - logistics
      - PLC
      - industrial
      - manufacturing
      - factory
      - sorting
      - conveyor
      - AI automation
      - automated
      - AGV
      - SCADA
      - IoT manufacturing

  energy:
    tags:
      - energy
    keywords:
      - energy
      - oil
      - gas
      - lng
      - solar
      - wind
      - nuclear
      - battery
      - grid
      - power
      - utility
      - utilities
      - renewable
      - pipeline
      - crude
      - refinery
      - petrochemical
      - drilling

# Action mapping keywords (for buy/sell/watch classification)
action_keywords:
  buy:
    - beats
    - beat
    - raises guidance
    - raised guidance
    - upgrades
    - upgraded
    - contract
    - award
    - awarded
    - record revenue
    - record profit
    - exceeds
    - exceeded
    - strong quarter
    - outperforms
    - acquisition
    - partnership
    - breakthrough

  sell:
    - misses
    - missed
    - cuts guidance
    - cut guidance
    - downgrades
    - downgraded
    - investigation
    - bankruptcy
    - layoffs
    - lawsuit
    - recall
    - warning
    - slump
    - plunge
    - tumbles

# Speculative words that trigger vagueness penalty
speculative_words:
  - may
  - could
  - explores
  - considers
  - plans
  - might
  - potentially
  - looking at

# Confidence scoring modifiers
confidence_modifiers:
  strong_keyword_bonus: 0.10
  base_confidence: 0.55
  max_confidence: 0.90
  uncertain_symbol_penalty: 0.15
  vagueness_penalty: 0.10  # Subtract if speculative words without hard actions

# Multi-factor sentiment scoring weights (RSS + momentum + volume)
sentiment_weights:
  rss: 0.4        # RSS confidence weight
  momentum: 0.3   # Price momentum weight (5-day vs 20-day SMA)
  volume: 0.3     # Volume surge weight (3-day vs 20-day avg)

# Sentiment thresholds for action mapping (when sentiment scoring enabled)
sentiment_thresholds:
  buy: 0.65      # Combined sentiment >= 0.65 → BUY
  sell: -0.55    # Combined sentiment <= -0.55 → SELL

# Defaults for candidate expiration and behavior
defaults:
  min_confidence: 0.55      # Lowered from 0.60 for sentiment mode
  ttl_minutes_buy: 1440     # 24 hours for buy signals (was 180)
  ttl_minutes_sell: 1440    # 24 hours for sell signals (was 120)
  ttl_minutes_watch: 1440   # 24 hours for watch signals (was 240)
  horizon_default: swing    # Changed from intraday for 1-5 day holds

# Safety constraints
safety:
  action_default_when_uncertain: watch
  max_candidates_per_run: 50
  require_symbol_allowlist: false
  symbol_allowlist: []
  symbol_denylist: []

# Screening quality controls
screening:
  liquidity_floor_usd: 20000000  # $20M minimum avg daily dollar volume (if available)
  duplicate_suppression_minutes: 60  # Suppress same symbol+action within 60 minutes

# Ticker validation stopwords (common false positives from RSS headlines)
stopwords:
  - CEO
  - AI
  - US
  - USA
  - IPO
  - ETF
  - SEC
  - FED
  - CPI
  - GDP
  - EPS
  - Q4
  - Q3
  - Q2
  - Q1
  - BTC
  - ETH
  - API
  - IT
  - HR
  - PR
  - IR
  - VP
  - SVP
  - EVP
  - CTO
  - CFO
  - COO
  - CMO

# LLM enrichment (optional)
candidates_enrichment_enabled: true  # Set to true to enable OpenAI enrichment
candidates_llm_provider: openai  # openai or anthropic
candidates_llm_model: gpt-4o-mini  # Cost-effective model for enrichment
candidates_min_confidence: 0.60  # Lowered from 0.70 to allow more candidates
candidates_max_count: 20  # Cap total candidates returned
candidates_llm_timeout: 30  # API timeout in seconds
