# Base strategy definitions for AI Trader
# These are the default configurations that can be overridden via out/strategies_overrides.json
#
# Each strategy runs independently on the same Alpaca account
# Allocation is managed by weight (relative allocation among enabled strategies)

strategies:
  - strategy_id: "Trend_MA20"
    name: "Trend Following (MA20)"
    description: "SMA crossover with 10/20 periods for trend following"
    enabled: true
    weight: 0.4  # 40% of available capital
    params:
      sma_fast_period: 10
      sma_slow_period: 20
    risk_limits:
      max_position_size: 8000   # Increased from 5000 to allow larger positions
      max_positions: 10         # Increased from 3 to allow more concurrent positions
      max_daily_loss: 500       # Max daily loss for this strategy

  - strategy_id: "MeanRev_Z1.0"
    name: "Mean Reversion (Z-Score 1.0)"
    description: "SMA crossover with 5/15 periods for mean reversion signals"
    enabled: true
    weight: 0.3  # 30% of available capital
    params:
      sma_fast_period: 5
      sma_slow_period: 15
    risk_limits:
      max_position_size: 6000  # Increased from 3000
      max_positions: 10        # Increased from 5
      max_daily_loss: 300

  - strategy_id: "Momentum_MACD"
    name: "Momentum (MACD-like)"
    description: "SMA crossover with 12/26 periods for momentum"
    enabled: true   # Enabled to increase activity
    weight: 0.3     # 30% of available capital
    params:
      sma_fast_period: 12
      sma_slow_period: 26
    risk_limits:
      max_position_size: 6000  # Increased from 4000
      max_positions: 10        # Increased from 4
      max_daily_loss: 400

  - strategy_id: "AI_COPILOT_WEIGHTED"
    name: "AI Co-Pilot Weighted Rebalancer"
    description: "Active trading strategy using per-sector ticker weights to allocate capital"
    enabled: false  # Default disabled (must explicitly enable via UI or overrides)
    weight: 0.10    # 10% of equity when enabled (adjust as needed)
    params:
      execution_enabled: false  # CRITICAL GUARDRAIL: Must explicitly enable to trade
      rebalance_threshold_pct: 0.02  # Reserved for phase 2 (smart rebalancing)
      allow_shorts: false            # Reserved for phase 2 (short positions)
      per_sector_weights:
        mega_cap_tech:
          NVDA: 0.25   # 25% of strategy allocation
          MSFT: 0.15   # 15% of strategy allocation
          AAPL: 0.10   # 10% of strategy allocation
        us_sector_etfs:
          XLF: 0.20    # 20% of strategy allocation
          XLV: 0.15    # 15% of strategy allocation
          XLE: 0.15    # 15% of strategy allocation
        # NOTE: Weights within per_sector_weights don't need to sum to 1.0
        # Strategy will normalize automatically across all active symbols
    risk_limits:
      max_position_size: 10000  # Max $10k per symbol
      max_positions: 10         # Max 10 concurrent positions
      max_daily_loss: 500       # Max $500 daily loss

# Global settings applied to all strategies
global:
  # These are account-wide limits (enforced separately from per-strategy limits)
  max_daily_loss: 1000          # Account-wide daily loss limit
  max_total_positions: 20       # Increased from 10 to allow more concurrent positions
  max_order_notional: 10000     # Max single order size

  # Market data and execution settings
  bar_timeframe: "1Min"
  market_open_hour: 9
  market_open_minute: 30
  market_close_hour: 16
  market_close_minute: 0
